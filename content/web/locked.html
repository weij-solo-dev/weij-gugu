<style>
body{font-family:-apple-system,"PingFang SC",Helvetica,Arial,sans-serif;margin:0;background:#f6f1e8;color:#2b2420}

<!-- Served to anyone but a phone on Gugu's hotspot in pairing mode (parent_api.c): it says how to get in, and nothing else. -->
<header>咕咕</header>
<main><section>
<h2>🔒 咕咕的设置页只在匹配模式下打开</h2>
<ol>
<li>在咕咕身上按住<b>黄键 3 秒</b>，屏幕上会出现一个码。</li>
<li>用手机相机扫这个码，连上咕咕的 Wi-Fi。</li>
<li>设置页会自己打开；没打开的话，扫咕咕屏幕上的下一个码。</li>
</ol>
<p class="muted">Wi-Fi 密码、Key、聊天记录和咕咕记得的事，只给手里拿着咕咕的人看。家里网络上的其它设备打不开这一页。</p>
</section></main>
</body></html>
